[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antios"
dynamic = ["version"]
description = "Windows privacy/system identity laboratory with safe scan, plan, backup and restore workflows"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AntiOS contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
]

[project.scripts]
antios = "antios.cli:main"

[tool.setuptools.dynamic]
version = { attr = "antios.__version__" }

[tool.setuptools.packages.find]
include = ["antios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
