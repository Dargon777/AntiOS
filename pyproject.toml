[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "antios"
dynamic = ["version"]
description = "Auditable Windows privacy and system-identity laboratory with safe scan, plan, backup and restore workflows"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Dargon777 and AntiOS contributors" }]
keywords = ["windows", "privacy", "system", "diagnostics", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Dargon777/AntiOS"
Repository = "https://github.com/Dargon777/AntiOS"
Issues = "https://github.com/Dargon777/AntiOS/issues"
Changelog = "https://github.com/Dargon777/AntiOS/blob/master/CHANGELOG.md"

[project.scripts]
antios = "antios.cli:main"

[tool.setuptools.dynamic]
version = { attr = "antios.__version__" }

[tool.setuptools.packages.find]
include = ["antios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
