name: AntiOS Store MSIX

on:
  pull_request:
    paths:
      - "antios/**"
      - "antios_gui_entry.py"
      - "store/**"
      - "scripts/build-store-msix.ps1"
      - ".github/workflows/store-msix.yml"
  workflow_dispatch:
    inputs:
      identity_name:
        description: "Partner Center Package/Identity/Name"
        required: false
        default: "Dargon777.AntiOS.Development"
      publisher:
        description: "Partner Center Package/Identity/Publisher"
        required: false
        default: "CN=AntiOS Development"
      publisher_display_name:
        description: "Publisher display name"
        required: false
        default: "Dargon777"
      package_version:
        description: "Store version (Major.Minor.Build.0)"
        required: false
        default: "2.0.9.0"

permissions:
  contents: read

jobs:
  build-store-msix:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build Store GUI executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --name AntiOS-GUI antios_gui_entry.py

      - name: Build unsigned Store MSIX
        shell: pwsh
        run: |
          $identity = "${{ github.event.inputs.identity_name || 'Dargon777.AntiOS.Development' }}"
          $publisher = "${{ github.event.inputs.publisher || 'CN=AntiOS Development' }}"
          $publisherDisplay = "${{ github.event.inputs.publisher_display_name || 'Dargon777' }}"
          $version = "${{ github.event.inputs.package_version || '2.0.9.0' }}"
          .\scripts\build-store-msix.ps1 `
            -IdentityName $identity `
            -Publisher $publisher `
            -PublisherDisplayName $publisherDisplay `
            -PackageVersion $version

      - uses: actions/upload-artifact@v4
        with:
          name: AntiOS-Store-MSIX
          path: store-output/AntiOS.msix
          if-no-files-found: error
