# One-time public prerelease from a successful master release workflow.
# Windows files are unsigned; do not claim Authenticode identity.
name: Publish unsigned AntiOS 3.0.01 Alpha

on:
  workflow_run:
    workflows: ["AntiOS release"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: antios-3-0-01-unsigned-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Confirm master commit and eligible draft
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < release/VERSION)" = "3.0.1a1"
          test "$(tr -d '\r\n' < release/TAG)" = "V.3.0.01-Alpha"
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq '.commit.sha')"
          test "$current" = "$BUILD_SHA"
          release_id="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "V.3.0.01-Alpha" '
              [.[][] | select(.tag_name == $tag)] |
              if length == 1 and .[0].draft == true and (.[0].assets | length) == 0
              then (.[0].id | tostring) else "" end')"
          if [[ -z "$release_id" ]]; then
            echo "No empty draft to publish; already published or no draft exists."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --refs \
            "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/V.3.0.01-Alpha" >/dev/null 2>&1; then
            echo "Refusing to replace an existing release tag." >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download exact successful CI artifacts
        if: steps.preflight.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" \
            --name AntiOS-release-artifacts --dir release-artifacts/windows
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" \
            --name AntiOS-linux-release-artifacts --dir release-artifacts/linux

      - name: Validate exactly eight build files and provenance
        if: steps.preflight.outputs.ready == 'true'
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(release-artifacts/windows/python-dist/antios-3.0.1a1-*.whl)
          sdists=(release-artifacts/windows/python-dist/antios-3.0.1a1.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          files=(
            release-artifacts/windows/AntiOS-Setup.exe
            release-artifacts/windows/AntiOS-Setup.exe.sha256
            release-artifacts/windows/AntiOS-windows-x64.zip
            release-artifacts/windows/AntiOS-windows-x64.zip.sha256
            "${wheels[0]}"
            "${sdists[0]}"
            release-artifacts/linux/AntiOS-linux-x64.tar.gz
            release-artifacts/linux/AntiOS-linux-x64.tar.gz.sha256
          )
          test "${#files[@]}" -eq 8
          for f in "${files[@]}"; do test -s "$f" && test ! -L "$f"; done
          test "$(find release-artifacts -type f | wc -l | tr -d '[:space:]')" -eq 8
          (cd release-artifacts/windows &&
            sha256sum -c AntiOS-Setup.exe.sha256 &&
            sha256sum -c AntiOS-windows-x64.zip.sha256)
          (cd release-artifacts/linux &&
            sha256sum -c AntiOS-linux-x64.tar.gz.sha256)
          unzip -tq release-artifacts/windows/AntiOS-windows-x64.zip
          unzip -p release-artifacts/windows/AntiOS-windows-x64.zip BUILD_INFO.txt |
            grep -Fqx "Commit: $BUILD_SHA"
          unzip -p release-artifacts/windows/AntiOS-windows-x64.zip BUILD_INFO.txt |
            grep -Fq "Unsigned direct-download build"
          tar -xOzf release-artifacts/linux/AntiOS-linux-x64.tar.gz ./BUILD_INFO.txt |
            grep -Fqx "Commit: $BUILD_SHA"

      - name: Upload files and publish as UNSIGNED prerelease
        if: steps.preflight.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_ID: ${{ steps.preflight.outputs.release_id }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="V.3.0.01-Alpha"
          test "$(gh api "repos/$repo/branches/master" --jq '.commit.sha')" = "$BUILD_SHA"
          test "$(gh api "repos/$repo/releases/$RELEASE_ID" --jq '.draft')" = "true"
          test "$(gh api "repos/$repo/releases/$RELEASE_ID" --jq '.tag_name')" = "$tag"
          test "$(gh api "repos/$repo/releases/$RELEASE_ID" --jq '.assets | length')" = "0"

          cat > "$RUNNER_TEMP/notes.md" <<EOF
          # AntiOS 3.0.01 Alpha — UNSIGNED prerelease

          Independent AntiOS scanning engine, Windows installer, dashboard and resident Guard.

          **This Windows installer and its executables are NOT digitally signed.** There is no verified Authenticode publisher identity, and Windows SmartScreen may warn. SHA-256 checksums confirm file integrity only, not the identity of the publisher.

          This is experimental alpha software. Do not rely on it as your only antivirus. Keep Microsoft Defender or another established antivirus enabled. Older AntiOS installations can require explicit migration: do not install over a production system without backups and testing.

          Detection Stage A and the newer dashboard currently developed in PR #82 are **not included** in this 3.0.01 build.

          Provenance: GitHub Actions run https://github.com/$repo/actions/runs/$BUILD_RUN from source commit $BUILD_SHA. Source, privacy and security policy are available in the repository.
          EOF

          jq -n --arg sha "$BUILD_SHA" --arg body "$(cat "$RUNNER_TEMP/notes.md")" \
            '{name:"AntiOS V.3.0.01-Alpha (UNSIGNED)",body:$body,target_commitish:$sha,draft:true,prerelease:true}' |
            gh api --method PATCH "repos/$repo/releases/$RELEASE_ID" --input - >/dev/null
          test "$(gh api "repos/$repo/releases/$RELEASE_ID" --jq '.draft')" = "true"
          shopt -s nullglob
          files=(
            release-artifacts/windows/AntiOS-Setup.exe
            release-artifacts/windows/AntiOS-Setup.exe.sha256
            release-artifacts/windows/AntiOS-windows-x64.zip
            release-artifacts/windows/AntiOS-windows-x64.zip.sha256
            release-artifacts/windows/python-dist/antios-3.0.1a1-*.whl
            release-artifacts/windows/python-dist/antios-3.0.1a1.tar.gz
            release-artifacts/linux/AntiOS-linux-x64.tar.gz
            release-artifacts/linux/AntiOS-linux-x64.tar.gz.sha256
          )
          test "${#files[@]}" -eq 8
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            test "$(gh api "repos/$repo/releases/$RELEASE_ID" --jq '.draft')" = "true"
            expected="sha256:$(sha256sum "$f" | cut -d ' ' -f1)"
            curl --fail-with-body --silent --show-error --retry 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://uploads.github.com/repos/$repo/releases/$RELEASE_ID/assets?name=$name" \
              > "$RUNNER_TEMP/upload-result.json"
            jq -e --arg name "$name" --arg digest "$expected" \
              '.name == $name and .state == "uploaded" and .digest == $digest' \
              "$RUNNER_TEMP/upload-result.json" >/dev/null
          done
          test "$(gh api "repos/$repo/releases/$RELEASE_ID" --jq '.assets | length')" = "8"
          test "$(gh api "repos/$repo/releases/$RELEASE_ID" --jq '.draft')" = "true"
          printf '%s\n' '{"draft":false,"prerelease":true}' |
            gh api --method PATCH "repos/$repo/releases/$RELEASE_ID" --input - >/dev/null
          test "$(gh api "repos/$repo/releases/$RELEASE_ID" --jq '.draft')" = "false"
          echo "Published unsigned alpha at https://github.com/$repo/releases/tag/$tag"
