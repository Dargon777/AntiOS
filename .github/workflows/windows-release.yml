name: AntiOS v2 Windows portable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "antios/**"
      - "tests/**"
      - "scripts/**"
      - "release/**"
      - "antios_entry.py"
      - "pyproject.toml"
      - ".github/workflows/windows-release.yml"
  push:
    branches: ["master"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: antios-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyinstaller
          python -m pip install -e .

      - name: Validate release version
        shell: pwsh
        run: |
          $packageVersion = (python -c "import antios; print(antios.__version__) ").Trim()
          $releaseVersion = (Get-Content .\release\VERSION -Raw).Trim()
          if ($packageVersion -ne $releaseVersion) {
            throw "Version mismatch: package=$packageVersion release=$releaseVersion"
          }

      - name: Run tests
        run: python -m pytest

      - name: Build portable executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --console --name AntiOS antios_entry.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          .\dist\AntiOS.exe --version
          .\dist\AntiOS.exe version
          .\dist\AntiOS.exe version --json | ConvertFrom-Json | Out-Null
          .\dist\AntiOS.exe config show --json | ConvertFrom-Json | Out-Null

      - name: Package portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item .\dist\AntiOS.exe .\package\AntiOS.exe
          Copy-Item .\scripts\install.ps1 .\package\install.ps1
          Copy-Item .\scripts\uninstall.ps1 .\package\uninstall.ps1
          Copy-Item .\README.md .\package\README.md
          Copy-Item .\SECURITY.md .\package\SECURITY.md
          Copy-Item .\CHANGELOG.md .\package\CHANGELOG.md
          $version = (Get-Content .\release\VERSION -Raw).Trim()
          $commit = "$env:GITHUB_SHA"
          $python = (python --version 2>&1).Trim()
          @(
            "AntiOS version: $version",
            "Commit: $commit",
            "Build runner: windows-latest",
            "Python: $python"
          ) | Set-Content .\package\BUILD_INFO.txt
          Compress-Archive -Path .\package\* -DestinationPath .\AntiOS-windows-x64.zip -Force
          $hash = (Get-FileHash .\AntiOS-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  AntiOS-windows-x64.zip" | Set-Content -NoNewline .\AntiOS-windows-x64.zip.sha256

      - name: Attest release archive provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/attest@v4
        with:
          subject-path: AntiOS-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AntiOS-windows-x64
          path: |
            AntiOS-windows-x64.zip
            AntiOS-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish alpha release on master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content .\release\TAG -Raw).Trim()
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping publication."
            exit 0
          }
          gh release create $tag `
            .\AntiOS-windows-x64.zip `
            .\AntiOS-windows-x64.zip.sha256 `
            --target $env:GITHUB_SHA `
            --prerelease `
            --title "AntiOS $tag" `
            --notes-file .\release\RELEASE_NOTES.md
