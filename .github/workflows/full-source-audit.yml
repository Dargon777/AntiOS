name: Full repository source audit

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  tracked-source-audit:
    name: All tracked files - line inventory, parsers, security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit parsers and Python security linter
        run: python -m pip install 'PyYAML>=6,<7' 'ruff>=0.13,<1'
      - name: Inventory every tracked file, inspect every line and parse source formats
        run: python scripts/audit-all-sources.py
      - name: Python security-rule findings (manual-review artifact)
        if: always()
        shell: bash
        run: |
          mkdir -p .audit
          ruff check antios scripts tests --select S --ignore S101,S311 --output-format json > .audit/ruff-security.json || true
          python -c 'import json; p=json.load(open(".audit/ruff-security.json")); print(f"Python security-rule review leads: {len(p)}")'
      - name: Preserve per-file and per-line coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-source-audit-linux
          path: .audit/
          if-no-files-found: error
          include-hidden-files: true

  powershell-grammar:
    name: Every tracked PowerShell script - grammar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts with the real AST parser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(git ls-files '*.ps1' '*.psm1' '*.psd1')
          $errors = @()
          foreach ($script in $scripts) {
            $tokens = $null
            $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location) $script), [ref]$tokens, [ref]$issues
            ) | Out-Null
            foreach ($issue in $issues) {
              $errors += ('{0}:{1} {2}' -f $script, $issue.Extent.StartLineNumber, $issue.Message)
            }
          }
          Write-Host ("Parsed {0} PowerShell scripts" -f $scripts.Count)
          foreach ($issue in $errors) { Write-Error $issue -ErrorAction Continue }
          if ($errors.Count -gt 0) { exit 1 }
      - name: Per-user installer / safe-uninstall Windows acceptance
        shell: pwsh
        run: ./tests/user-install-uninstall-smoke.ps1
      - name: Official ClamAV archive SHA256 and installed receipt trust smoke
        shell: powershell
        run: ./tests/clamav-archive-trust-smoke.ps1
      - name: ClamAV repair SCM/task ownership and postcondition behavioral smoke
        shell: powershell
        run: ./tests/clamav-repair-validation-smoke.ps1

  native-codeql:
    name: C/C++ CodeQL with pinned WDK native build
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Compile the native driver and service while CodeQL traces the build
        shell: pwsh
        run: ./native/windows/build.ps1 -Restore
      - uses: github/codeql-action/analyze@v4
