name: AntiOS v2 tests

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: antios-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clamav-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install real ClamD and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav-daemon
          python -m pip install pytest -e .
      - name: Test real engine with inert rules and archives
        env:
          ANTIOS_REQUIRE_CLAMD: "1"
          ANTIOS_TEST_CLAMD: /usr/sbin/clamd
        run: python -m pytest tests/test_clamav_integration.py -v


  windows10-api-proxy:
    name: Windows 10-era API proxy (not Win10 certification)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show proxy runner version
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber | Format-List

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Compatibility smoke
        shell: pwsh
        run: |
          python -m pytest -rs tests/test_system_info.py tests/test_health.py tests/test_doctor.py tests/test_guard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m antios --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Test
        run: python -m pytest -rs
