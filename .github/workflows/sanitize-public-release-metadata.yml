name: Sanitize public release metadata

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sanitize-public-release-metadata.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Replace every public release body with the minimal public template
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );

            for (const release of releases) {
              const body = [
                `# AntiOS ${release.tag_name}`,
                "",
                "This historical prerelease contains user-facing improvements, reliability fixes and compatibility updates.",
                "",
                "Public release metadata intentionally omits internal security implementation details that could make reconnaissance, reverse engineering or bypass development easier.",
                "",
                "For supported usage, current limitations, privacy information and responsible vulnerability reporting, see README.md, PRIVACY.md and SECURITY.md.",
                "",
                "AntiOS v2 remains prerelease software."
              ].join("\n");

              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                name: `AntiOS ${release.tag_name}`,
                body,
                prerelease: true
              });
            }

            core.notice(`Sanitized ${releases.length} public releases.`);
