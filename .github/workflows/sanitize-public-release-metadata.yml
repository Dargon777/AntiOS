name: Sanitize public release metadata

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sanitize-public-release-metadata.yml"

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Sanitize release descriptions
        uses: actions/github-script@v7
        with:
          script: |
            const notes = `# AntiOS public prerelease summary

            This historical AntiOS v2 prerelease contains user-facing improvements in security, diagnostics, reliability, compatibility, interface and/or storage features.

            Security-sensitive implementation details have been removed from the public release description. Public release metadata intentionally does not document internal control flow, trust-boundary sequencing, persistence mechanics, state/IPC layouts, service/task identities, provider handoffs, retry/timeout values, queue/cache parameters, detection thresholds, native protocol internals, repair/rollback sequencing or update activation details.

            This documentation policy reduces unnecessary reconnaissance value but is not a substitute for secure design, signed updates, least privilege, code review and fail-safe behavior.

            For vulnerability reporting, use the repository's SECURITY.md and private vulnerability reporting when available.`;

            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            });

            for (const release of releases) {
              core.info(`Sanitizing ${release.tag_name}`);
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                body: notes
              });
            }
